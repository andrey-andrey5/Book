<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mountain Gear | Магазин горных аксессуаров</title>
    <!-- Font Awesome 6 (бесплатные иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.5;
        }

        /* Современная шапка */
        .header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e2e8f0;
        }

        .navbar {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c2c, #2c5a3e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .logo p {
            font-size: 0.75rem;
            color: #475569;
        }

        .actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
            color: #1e293b;
            transition: 0.2s ease;
            padding: 0.4rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .icon-btn:hover {
            background: #f1f5f9;
            color: #2c5a3e;
            transform: scale(1.02);
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: #e11d48;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 0.2rem 0.45rem;
            border-radius: 30px;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Сетка товаров */
        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 5px solid #2c5a3e;
            padding-left: 1rem;
            color: #0f172a;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Карточка товара */
        .product-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease;
            border: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
            border-color: #cbd5e1;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #e2e8f0;
            display: block;
            transition: 0.2s;
        }
        /* Визуальное обозначение пустых картинок — пользователь вставит свои ссылки */
        .product-img[src=""], .product-img:not([src]) {
            background: #eef2ff;
            background-image: repeating-linear-gradient(45deg, #ddd6fe22 0px, #ddd6fe22 30px, #cbd5e122 30px, #cbd5e122 60px);
        }

        .product-info {
            padding: 1.2rem 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            color: #0f172a;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .price {
            font-weight: 700;
            font-size: 1.4rem;
            color: #1e3c2c;
            margin: 0.5rem 0 1rem;
        }

        .card-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: auto;
        }

        .btn-primary, .btn-outline {
            flex: 1;
            padding: 0.7rem 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: white;
        }

        .btn-primary {
            background: #1e3c2c;
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-primary:hover {
            background: #2a5a3e;
            transform: scale(0.98);
        }

        .btn-outline {
            border: 1px solid #cbd5e1;
            background: white;
            color: #1e293b;
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #2c5a3e;
            color: #2c5a3e;
        }

        .fav-active {
            color: #e11d48;
            border-color: #fecdd3;
            background: #fff5f6;
        }
        .fav-active i {
            font-weight: 900;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 2rem;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.8rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 0.75rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
            transition: 0.1s;
        }

        .cart-item, .fav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #edf2f7;
        }

        .cart-item-info, .fav-item-info {
            flex: 2;
        }

        .cart-item-title, .fav-item-title {
            font-weight: 600;
        }

        .cart-price {
            color: #1e3c2c;
            font-weight: 500;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
        }

        .qty-btn {
            background: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .remove-item {
            background: none;
            border: none;
            color: #e11d48;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .cart-total {
            margin-top: 1.5rem;
            text-align: right;
            font-weight: 800;
            font-size: 1.3rem;
            padding-top: 1rem;
            border-top: 2px dashed #cbd5e1;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }

        .btn-clear {
            margin-top: 1.2rem;
            background: #f1f5f9;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
        }

        @media (max-width: 680px) {
            .navbar {
                padding: 0.8rem 1rem;
            }
            .container {
                padding: 0 1rem;
            }
            .products-grid {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="navbar">
        <div class="logo">
            <h1>🏔️ MOUNTAIN GEAR</h1>
            <p>аксессуары для вершин</p>
        </div>
        <div class="actions">
            <button class="icon-btn" id="favoriteBtn">
                <i class="fa-regular fa-heart"></i>
                <span id="favCount" class="badge">0</span>
            </button>
            <button class="icon-btn" id="cartBtn">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cartCount" class="badge">0</span>
            </button>
        </div>
    </div>
</header>

<main class="container">
    <div class="section-title">⚡ Снаряжение для гор</div>
    <div id="productsGrid" class="products-grid"></div>
</main>

<footer>
    <p>🌲 Надёжные аксессуары для треккинга, альпинизма и кемпинга</p>
    <p style="margin-top: 8px;">© Mountain Gear — ваш проводник в горах</p>
</footer>

<!-- Модалка корзины -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span><i class="fa-solid fa-bag-shopping"></i> Корзина</span>
            <button class="close-modal" id="closeCartModal">&times;</button>
        </div>
        <div id="cartItemsList"></div>
        <div id="cartTotal" class="cart-total"></div>
        <button id="clearCartBtn" class="btn-clear"><i class="fa-regular fa-trash-can"></i> Очистить корзину</button>
    </div>
</div>

<!-- Модалка избранного -->
<div id="favModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span><i class="fa-regular fa-heart"></i> Избранное</span>
            <button class="close-modal" id="closeFavModal">&times;</button>
        </div>
        <div id="favItemsList"></div>
    </div>
</div>

<script>
    // ------------------- ТОВАРЫ (картинки ссылки пустые — вставите сами) ------------------
    const products = [
        { id: 1, name: "Экспедиционная палатка", desc: "4 сезона, ветрозащита, 3-4 чел.", price: 18990, imgSrc: "orig.webp" },
        { id: 2, name: "Газовая горелка", desc: "компактная, ветроустойчивая, 2800W", price: 3490, imgSrc: "Gorelka.webp" },
        { id: 3, name: "Треккинговые палки", desc: "карбон, антишок, регулировка", price: 5990, imgSrc: "-66860_2.png" },
        { id: 4, name: "Навигитор GPS", desc: "топокарты, аккумулятор 30ч", price: 24990, imgSrc: "navigator_garmin_etrex_22x_gps.jpeg" },
        { id: 5, name: "Карабин автомат", desc: "сталь, 25kN, для страховки", price: 1890, imgSrc: "karabin_oval_avtomat_1-800x800.jpg" },
        { id: 6, name: "Налобный фонарь", desc: "700 люмен, влагозащита IPX6", price: 4290, imgSrc: "Налобный_фонарь_HM70R__LUMINUS_SST40__ANSI_1600_лм__21700__FENIX.jpg" }
    ];

    // Состояние приложения
    let cart = [];            // { id, quantity, name, price }
    let favorites = [];      // массив id товаров

    // --- Вспомогательные ---
    function saveToLocal() {
        localStorage.setItem('mountain_cart', JSON.stringify(cart));
        localStorage.setItem('mountain_fav', JSON.stringify(favorites));
    }

    function loadFromLocal() {
        const savedCart = localStorage.getItem('mountain_cart');
        const savedFav = localStorage.getItem('mountain_fav');
        if(savedCart) cart = JSON.parse(savedCart);
        if(savedFav) favorites = JSON.parse(savedFav);
    }

    // Обновление счетчиков в шапке
    function updateCounters() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').innerText = totalItems;
        document.getElementById('favCount').innerText = favorites.length;
    }

    // Обновление внешнего вида кнопки избранного на карточке
    function setFavButtonStyle(btn, productId) {
        const isFav = favorites.includes(productId);
        if(isFav) {
            btn.classList.add('fav-active');
            btn.innerHTML = '<i class="fa-solid fa-heart"></i> В избранном';
        } else {
            btn.classList.remove('fav-active');
            btn.innerHTML = '<i class="fa-regular fa-heart"></i> Избранное';
        }
    }

    // Добавить/удалить из избранного
    function toggleFavorite(productId, buttonElement) {
        const index = favorites.indexOf(productId);
        if(index === -1) {
            favorites.push(productId);
        } else {
            favorites.splice(index, 1);
        }
        saveToLocal();
        updateCounters();
        if(buttonElement) setFavButtonStyle(buttonElement, productId);
        renderFavModal();      // обновляем модалку если открыта
    }

    // Корзина: добавить товар
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        if(!product) return;
        const existing = cart.find(item => item.id === productId);
        if(existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
        }
        saveToLocal();
        updateCounters();
        renderCartModal();     // обновляем содержимое модалки, если открыта
        // легкий визуальный фидбек (опционально)
        const cartBtn = document.getElementById('cartBtn');
        cartBtn.style.transform = 'scale(1.1)';
        setTimeout(() => cartBtn.style.transform = '', 150);
    }

    // Изменить количество в корзине
    function changeQuantity(productId, delta) {
        const idx = cart.findIndex(i => i.id === productId);
        if(idx === -1) return;
        const newQty = cart[idx].quantity + delta;
        if(newQty <= 0) {
            cart.splice(idx, 1);
        } else {
            cart[idx].quantity = newQty;
        }
        saveToLocal();
        updateCounters();
        renderCartModal();
    }

    function removeCartItem(productId) {
        cart = cart.filter(i => i.id !== productId);
        saveToLocal();
        updateCounters();
        renderCartModal();
    }

    function clearCart() {
        cart = [];
        saveToLocal();
        updateCounters();
        renderCartModal();
    }

    // --- Отрисовка карточек товаров (всегда актуальные кнопки избранного)---
    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        products.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';
            // img с пустым src, пользователь сам вставит ссылки позже
            card.innerHTML = `
                <img class="product-img" src="${prod.imgSrc}" alt="${prod.name}" onerror="this.style.background='#e2e8f0'">
                <div class="product-info">
                    <div class="product-title">${prod.name}</div>
                    <div class="product-desc">${prod.desc}</div>
                    <div class="price">${prod.price.toLocaleString()} ₽</div>
                    <div class="card-buttons">
                        <button class="btn-primary add-to-cart" data-id="${prod.id}"><i class="fa-solid fa-cart-plus"></i> В корзину</button>
                        <button class="btn-outline fav-toggle" data-id="${prod.id}"><i class="fa-regular fa-heart"></i> Избранное</button>
                    </div>
                </div>
            `;
            const addBtn = card.querySelector('.add-to-cart');
            const favBtn = card.querySelector('.fav-toggle');
            addBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                addToCart(prod.id);
            });
            favBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFavorite(prod.id, favBtn);
            });
            // установить актуальную стилизацию кнопки избранного
            setFavButtonStyle(favBtn, prod.id);
            grid.appendChild(card);
        });
    }

    // Модалка корзины: подробный рендер
    function renderCartModal() {
        const container = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotal');
        if(!container) return;
        if(cart.length === 0) {
            container.innerHTML = '<div class="empty-msg"><i class="fa-regular fa-basket-shopping"></i> Корзина пуста. Добавьте снаряжение!</div>';
            totalSpan.innerHTML = '';
            return;
        }
        let totalSum = 0;
        let html = '';
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            totalSum += itemTotal;
            html += `
                <div class="cart-item" data-id="${item.id}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-price">${item.price.toLocaleString()} ₽</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="cart-quantity">
                            <button class="qty-btn dec-qty" data-id="${item.id}">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn inc-qty" data-id="${item.id}">+</button>
                        </div>
                        <button class="remove-item" data-id="${item.id}"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        totalSpan.innerHTML = `Итого: ${totalSum.toLocaleString()} ₽`;

        // Вешаем события на кнопки внутри модалки
        document.querySelectorAll('.dec-qty').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                changeQuantity(id, -1);
            });
        });
        document.querySelectorAll('.inc-qty').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                changeQuantity(id, 1);
            });
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                removeCartItem(id);
            });
        });
    }

    // Модалка избранного
    function renderFavModal() {
        const container = document.getElementById('favItemsList');
        if(!container) return;
        if(favorites.length === 0) {
            container.innerHTML = '<div class="empty-msg"><i class="fa-regular fa-heart"></i> Нет избранных товаров. Добавьте понравившиеся!</div>';
            return;
        }
        let html = '';
        favorites.forEach(favId => {
            const product = products.find(p => p.id === favId);
            if(product) {
                html += `
                    <div class="fav-item">
                        <div class="fav-item-info">
                            <div class="fav-item-title">${product.name}</div>
                            <div style="font-size:0.8rem; color:#475569;">${product.price.toLocaleString()} ₽</div>
                        </div>
                        <button class="remove-fav" data-id="${favId}" style="background:none; border:none; color:#e11d48; font-size:1.2rem; cursor:pointer;">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
        document.querySelectorAll('.remove-fav').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                favorites = favorites.filter(f => f !== id);
                saveToLocal();
                updateCounters();
                renderFavModal();
                // обновить стили кнопок на карточках (перерисовать карточки, чтобы обновить кнопки избранного)
                renderProducts();   // обновит все карточки, сохраняя актуальное состояние fav
            });
        });
    }

    // Модальные окна: открыть/закрыть
    const cartModal = document.getElementById('cartModal');
    const favModal = document.getElementById('favModal');
    const cartBtn = document.getElementById('cartBtn');
    const favBtn = document.getElementById('favoriteBtn');
    const closeCart = document.getElementById('closeCartModal');
    const closeFav = document.getElementById('closeFavModal');
    const clearCartBtn = document.getElementById('clearCartBtn');

    function openCartModal() {
        renderCartModal();
        cartModal.classList.add('active');
    }
    function openFavModal() {
        renderFavModal();
        favModal.classList.add('active');
    }
    function closeModals() {
        cartModal.classList.remove('active');
        favModal.classList.remove('active');
    }

    cartBtn.addEventListener('click', openCartModal);
    favBtn.addEventListener('click', openFavModal);
    closeCart.addEventListener('click', closeModals);
    closeFav.addEventListener('click', closeModals);
    window.addEventListener('click', (e) => {
        if(e.target === cartModal) closeModals();
        if(e.target === favModal) closeModals();
    });
    if(clearCartBtn) {
        clearCartBtn.addEventListener('click', () => {
            clearCart();
        });
    }

    // Инициализация
    loadFromLocal();
    renderProducts();
    updateCounters();
    // предзаполним модалки (чтобы при открытии сразу данные)
    renderCartModal();
    renderFavModal();

    // Добавляем возможность закрыть по Escape
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') {
            closeModals();
        }
    });
</script>
</body>
</html>
